<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Jadwal — Staff</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" href="/staff">
      <div class="brand__logoBox">
          <img src="/assets/logo-ac.png" alt="Logo Service AC Sunggal" class="brand__logoImg">
        </div>
      <div class="brand__text">
        <div class="brand__name">Service AC Sunggal</div>
        <div class="brand__tag">Jadwal Ketersediaan (Read-only)</div>
      </div>
    </a>
    <nav class="nav">
      <a href="/staff">Dashboard</a>
      <a class="nav__active" href="/staff/jadwal">Jadwal</a>
      <a href="/staff/catatan">Catatan</a>
      <a href="/logout">Logout</a>
    </nav>
  </div>
</header>

<main class="container page">
  <div class="pageHead">
    <div>
      <h1>Jadwal Bulanan</h1>
      <p class="muted">Biru = tersedia • Merah = penuh</p>
    </div>
    <div class="pageHead__actions">
      <button class="btn btn--ghost" id="prevBtn">← Bulan</button>
      <div class="pill pill--info" id="monthLabel">—</div>
      <button class="btn btn--ghost" id="nextBtn">Bulan →</button>
    </div>
  </div>

  <section class="card cardPad">
    <div class="calendarHeader">
      <div class="muted small">Sen</div><div class="muted small">Sel</div><div class="muted small">Rab</div>
      <div class="muted small">Kam</div><div class="muted small">Jum</div><div class="muted small">Sab</div><div class="muted small">Min</div>
    </div>
    <div class="calendarGrid" id="calendar"></div>
  </section>
</main>

<script src="/staff-readonly.js"></script>
</body>
</html>
