<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catatan Pekerjaan — Admin</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="role-bos">
  <header class="topbar">
  <div class="container topbar__inner">

    <a class="brand" href="/admin">
      <div class="brand__logoBox">
        <img src="/assets/logo-ac.png" class="brand__logoImg" alt="">
      </div>
      <div class="brand__text">
        <div class="brand__name">Service AC Sunggal</div>
        <div class="brand__tag">Admin Panel</div>
      </div>
    </a>

    <!-- NAV DESKTOP -->
    <nav class="nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/atur">Atur Jadwal</a>
      <a href="/admin/bulanan">Bulanan</a>
      <a href="/admin/users">Staff</a>
      <a href="/logout">Logout</a>
    </nav>

    <!-- HAMBURGER BUTTON -->
    <button class="menuBtn" id="menuBtn" type="button">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- MOBILE NAV -->
  <div class="mobileNav" id="mobileNav">
    <a href="/admin">Dashboard</a>
    <a href="/admin/atur">Atur Jadwal</a>
    <a href="/admin/bulanan">Bulanan</a>
    <a href="/admin/users">Staff</a>
    <a href="/logout">Logout</a>
  </div>
</header>

  <main class="container page">
    <div class="pageHead">
      <div>
        <h1>Catatan Pekerjaan</h1>
        <p class="muted">Tanggal: <b id="dateLabel">-</b></p>
      </div>
      <div class="pageHead__actions">
        <a class="btn btn--ghost" id="backToCalendar" href="/admin/atur">← Kembali</a>
      </div>
    </div>

    <section class="card cardPad">
      <h3 style="margin:0 0 10px;">Tambah Catatan</h3>
      <form id="jobForm" class="jobForm">
        <input type="hidden" id="jobDate" name="date" />
        <label class="field">
          <span>Nama client</span>
          <input id="namaClient" name="namaClient" required />
        </label>
        <label class="field">
          <span>Alamat</span>
          <input id="alamat" name="alamat" required />
        </label>
        <label class="field">
          <span>Kendala (atau cuci saja)</span>
          <textarea id="kendala" name="kendala" rows="3" required></textarea>
        </label>

        <button class="btn btn--primary" type="submit">Simpan Catatan</button>
      </form>
    </section>

    <section class="card cardPad" style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <h3 style="margin:0;">Daftar Catatan</h3>
        <span class="muted small" id="countLabel"></span>
      </div>
      <div id="jobsList" class="jobsList" style="margin-top:10px;"></div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script>
(function(){
  const btn = document.getElementById("menuBtn");
  const nav = document.getElementById("mobileNav");
  if(!btn || !nav) return;

  btn.addEventListener("click", () => {
    nav.classList.toggle("is-open");
  });

  nav.querySelectorAll("a").forEach(a=>{
    a.addEventListener("click", ()=> nav.classList.remove("is-open"));
  });
})();
</script>
</body>
</html>
