<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Kelola Staff — Admin</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body class="role-bos">
<header class="topbar">
  <div class="container topbar__inner">

    <a class="brand" href="/admin">
      <div class="brand__logoBox">
        <img src="/assets/logo-ac.png" class="brand__logoImg" alt="">
      </div>
      <div class="brand__text">
        <div class="brand__name">Service AC Sunggal</div>
        <div class="brand__tag">Admin Panel</div>
      </div>
    </a>

    <!-- NAV DESKTOP -->
    <nav class="nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/atur">Atur Jadwal</a>
      <a href="/admin/bulanan">Bulanan</a>
      <a href="/admin/users">Staff</a>
      <a href="/logout">Logout</a>
    </nav>

    <!-- HAMBURGER BUTTON -->
    <button class="menuBtn" id="menuBtn" type="button">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- MOBILE NAV -->
  <div class="mobileNav" id="mobileNav">
    <a href="/admin">Dashboard</a>
    <a href="/admin/atur">Atur Jadwal</a>
    <a href="/admin/bulanan">Bulanan</a>
    <a href="/admin/users">Staff</a>
    <a href="/logout">Logout</a>
  </div>
</header>

<main class="container page">
  <section class="card cardPad">
    <h1 style="margin:0 0 10px;">Buat Akun Staff</h1>
    <form id="staffForm" class="jobForm">
      <label class="field">
        <span>Username</span>
        <input name="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" required />
      </label>
      <button class="btn btn--primary" type="submit">Buat Staff</button>
      <div class="muted small" id="msg" style="margin-top:8px;"></div>
    </form>
  </section>

  <section class="card cardPad" style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0;">Daftar User</h3>
      <button class="btn btn--ghost" id="reload">Refresh</button>
    </div>
    <div id="userList" class="jobsList" style="margin-top:10px;"></div>
  </section>
</main>

<script>
async function loadUsers(){
  const res = await fetch("/api/admin/users", { credentials: "include" });
  if(!res.ok){
    const txt = await res.text().catch(()=> "");
    alert("Gagal load users: " + res.status + " " + txt.slice(0,120));
    return;
  }

  const data = await res.json();
  const list = document.getElementById("userList");
  const users = data.users || [];

  list.innerHTML = users.map(u => `
    <div class="jobCard">
      <div class="jobCard__top">
        <div class="jobCard__title">${u.username} <span class="muted small">(${u.role})</span></div>
        ${u.role === "staff" ? `<button class="btn btn--ghost btn--xs" data-del="${u.id}">Hapus</button>` : ""}
      </div>
      <div class="muted small">ID: ${u.id}</div>
    </div>
  `).join("");

  list.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.getAttribute("data-del");
      if(!confirm("Yakin hapus akun staff ini?")) return;

      const delRes = await fetch(`/api/admin/users?id=${encodeURIComponent(id)}`, {
        method:"DELETE",
        credentials: "include"
      });

      const j = await delRes.json().catch(()=> ({}));
      if(!delRes.ok){
        alert(j.error || ("Gagal hapus: " + delRes.status));
        return;
      }

      await loadUsers();
    });
  });
}

document.getElementById("reload").addEventListener("click", loadUsers);

document.getElementById("staffForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = { username: fd.get("username"), password: fd.get("password") };

  const res = await fetch("/api/admin/users", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload),
    credentials: "include"
  });

  const msg = document.getElementById("msg");
  const j = await res.json().catch(()=> ({}));

  if(!res.ok){
    msg.textContent = j.error || "Gagal";
    return;
  }

  msg.textContent = "Akun staff berhasil dibuat.";
  e.target.reset();
  await loadUsers();
});

loadUsers();
</script>

<script>
(function(){
  const btn = document.getElementById("menuBtn");
  const nav = document.getElementById("mobileNav");
  if(!btn || !nav) return;

  btn.addEventListener("click", () => {
    nav.classList.toggle("is-open");
  });

  nav.querySelectorAll("a").forEach(a=>{
    a.addEventListener("click", ()=> nav.classList.remove("is-open"));
  });
})();
</script>

</body>
</html>
